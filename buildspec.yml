version: 0.2

phases:
  pre_build:
    commands:
      - echo "Starting pre-build phase"
      - python3 --version  # Log Python version to confirm correct version is used
      - pip3 --version  # Log pip version to ensure pip is properly installed
      - pip3 install --upgrade pip  # Upgrade pip to the latest version
      - pip3 install -r requirements.txt  # Install dependencies
  build:
    commands:
      - echo "Building the application"
  post_build:
    commands:
      - echo "Post-build phase completed"

artifacts:
  files:
    - '**/*'  # Ensure all files are included in the build output
